<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" role="img" aria-label="Marginalia: Bartleby, el libro de la casa, paseando por la balda">
  <style>
    :root{--fondo:#FAF8F0;--linea:#E8E5DA;--tinta:#191817;--tinta2:#5D5C55;--esmeralda:#117A54;--esmeralda2:#0A5238;--ambar:#E09A26;--ambar2:#A26608;--teal:#14735E;--madera:#A0794A;--madera2:#6B4E2E;--hueso:#E3D6B8;}
    text{font-family:Georgia,"Times New Roman",serif;}
    .paseo{animation:pasear 16s linear infinite alternate;}
    .volteo{animation:volteo 32s steps(1) infinite;transform-box:fill-box;transform-origin:center;}
    .brinco{animation:brincar .5s steps(2) infinite;}
    #pA{animation:zA .5s steps(1) infinite;}
    #pB{opacity:0;animation:zB .5s steps(1) infinite;}
    @keyframes pasear{from{transform:translateX(0);}to{transform:translateX(360px);}}
    @keyframes volteo{0%,49.99%{transform:scaleX(1);}50%,100%{transform:scaleX(-1);}}
    @keyframes brincar{0%,49%{transform:translateY(0);}50%,100%{transform:translateY(-2px);}}
    @keyframes zA{0%,49%{opacity:1;}50%,100%{opacity:0;}}
    @keyframes zB{0%,49%{opacity:0;}50%,100%{opacity:1;}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important;}#pB{opacity:0;}}
  </style>

  <!-- tarjeta de papel -->
  <rect x="1" y="1" width="798" height="148" rx="12" fill="var(--fondo)" stroke="var(--linea)" stroke-width="2"/>

  <!-- rótulo -->
  <text x="400" y="46" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="6" fill="var(--tinta)">MARGINALIA</text>
  <text x="400" y="66" text-anchor="middle" font-size="11.5" font-style="italic" fill="var(--tinta2)">libros desde 1983 · los viernes, club de lectura</text>

  <!-- franjas de la casa -->
  <rect x="40" y="76" width="720" height="4" rx="1" fill="var(--esmeralda)"/>
  <rect x="40" y="82" width="720" height="3" rx="1" fill="var(--ambar)"/>
  <rect x="40" y="87" width="720" height="2" rx="1" fill="var(--teal)"/>

  <!-- balda -->
  <rect x="40" y="126" width="720" height="6" fill="var(--madera)"/>
  <rect x="40" y="132" width="720" height="3" fill="var(--madera2)"/>

  <!-- libros (izquierda) -->
  <g shape-rendering="crispEdges">
    <rect x="60" y="84" width="14" height="42" fill="var(--esmeralda)"/><rect x="60" y="84" width="3" height="42" fill="var(--esmeralda2)"/><rect x="60" y="92" width="14" height="3" fill="var(--ambar)"/>
    <rect x="76" y="93" width="10" height="33" fill="var(--ambar)"/><rect x="76" y="93" width="2" height="33" fill="var(--ambar2)"/><rect x="76" y="100" width="10" height="3" fill="var(--hueso)"/>
    <rect x="88" y="80" width="12" height="46" fill="var(--teal)"/><rect x="88" y="80" width="2" height="46" fill="var(--esmeralda2)"/><rect x="88" y="88" width="12" height="3" fill="var(--hueso)"/>
    <rect x="102" y="96" width="9" height="30" fill="var(--hueso)"/><rect x="102" y="96" width="2" height="30" fill="var(--madera)"/><rect x="102" y="103" width="9" height="2" fill="var(--esmeralda)"/>
    <rect x="113" y="86" width="13" height="40" fill="var(--esmeralda2)"/><rect x="113" y="86" width="3" height="40" fill="var(--madera2)"/><rect x="113" y="94" width="13" height="3" fill="var(--ambar)"/>
    <rect x="128" y="91" width="11" height="35" fill="var(--ambar)"/><rect x="128" y="91" width="2" height="35" fill="var(--ambar2)"/><rect x="128" y="99" width="11" height="3" fill="var(--hueso)"/>
    <rect x="141" y="82" width="12" height="44" fill="var(--teal)"/><rect x="141" y="82" width="2" height="44" fill="var(--esmeralda2)"/><rect x="141" y="90" width="12" height="3" fill="var(--hueso)"/>
    <rect x="155" y="95" width="10" height="31" fill="var(--esmeralda)"/><rect x="155" y="95" width="2" height="31" fill="var(--esmeralda2)"/><rect x="155" y="102" width="10" height="3" fill="var(--ambar)"/>
    <rect x="167" y="88" width="11" height="38" fill="var(--hueso)"/><rect x="167" y="88" width="2" height="38" fill="var(--madera)"/><rect x="167" y="96" width="11" height="2" fill="var(--teal)"/>
  </g>

  <!-- libros (derecha) -->
  <g shape-rendering="crispEdges">
    <rect x="612" y="90" width="11" height="36" fill="var(--ambar)"/><rect x="612" y="90" width="2" height="36" fill="var(--ambar2)"/><rect x="612" y="98" width="11" height="3" fill="var(--hueso)"/>
    <rect x="625" y="81" width="14" height="45" fill="var(--esmeralda)"/><rect x="625" y="81" width="3" height="45" fill="var(--esmeralda2)"/><rect x="625" y="89" width="14" height="3" fill="var(--ambar)"/>
    <rect x="641" y="95" width="9" height="31" fill="var(--hueso)"/><rect x="641" y="95" width="2" height="31" fill="var(--madera)"/><rect x="641" y="102" width="9" height="2" fill="var(--esmeralda)"/>
    <rect x="652" y="85" width="12" height="41" fill="var(--teal)"/><rect x="652" y="85" width="2" height="41" fill="var(--esmeralda2)"/><rect x="652" y="93" width="12" height="3" fill="var(--hueso)"/>
    <rect x="666" y="92" width="10" height="34" fill="var(--esmeralda2)"/><rect x="666" y="92" width="2" height="34" fill="var(--madera2)"/><rect x="666" y="99" width="10" height="3" fill="var(--ambar)"/>
    <rect x="678" y="82" width="13" height="44" fill="var(--ambar)"/><rect x="678" y="82" width="3" height="44" fill="var(--ambar2)"/><rect x="678" y="90" width="13" height="3" fill="var(--hueso)"/>
    <rect x="693" y="96" width="9" height="30" fill="var(--esmeralda)"/><rect x="693" y="96" width="2" height="30" fill="var(--esmeralda2)"/><rect x="693" y="103" width="9" height="2" fill="var(--ambar)"/>
    <rect x="704" y="87" width="12" height="39" fill="var(--teal)"/><rect x="704" y="87" width="2" height="39" fill="var(--esmeralda2)"/><rect x="704" y="95" width="12" height="3" fill="var(--hueso)"/>
    <rect x="718" y="93" width="10" height="33" fill="var(--hueso)"/><rect x="718" y="93" width="2" height="33" fill="var(--madera)"/><rect x="718" y="100" width="10" height="2" fill="var(--teal)"/>
    <rect x="730" y="84" width="12" height="42" fill="var(--esmeralda2)"/><rect x="730" y="84" width="3" height="42" fill="var(--madera2)"/><rect x="730" y="92" width="12" height="3" fill="var(--ambar)"/>
  </g>

  <!-- Bartleby: el mismo sprite de public/index.html, escala ×3 -->
  <g transform="translate(195,69)">
    <g class="paseo">
      <g class="volteo">
        <g class="brinco">
          <g transform="scale(3)" shape-rendering="crispEdges">
            <rect x="3"  y="1"  width="11" height="1"  fill="#FFF8E7"/>
            <rect x="2"  y="2"  width="11" height="13" fill="#7D2B2B"/>
            <rect x="2"  y="2"  width="2"  height="13" fill="#571D1D"/>
            <rect x="13" y="2"  width="1"  height="13" fill="#FFF8E7"/>
            <rect x="14" y="2"  width="1"  height="13" fill="#E3D6B8"/>
            <rect x="6"  y="4"  width="1"  height="2"  fill="#1D150F"/>
            <rect x="9"  y="4"  width="1"  height="2"  fill="#1D150F"/>
            <rect x="5"  y="9"  width="7"  height="1"  fill="#D8A03C"/>
            <rect x="6"  y="11" width="5"  height="1"  fill="#D8A03C"/>
            <rect x="14" y="15" width="1"  height="3"  fill="#D8A03C"/>
            <g id="pA">
              <rect x="4" y="15" width="2" height="4" fill="#29211A"/>
              <rect x="9" y="15" width="2" height="4" fill="#29211A"/>
            </g>
            <g id="pB">
              <rect x="6"  y="15" width="2" height="4" fill="#29211A"/>
              <rect x="11" y="15" width="2" height="4" fill="#29211A"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
